<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="龙泡泡大作战 - 一款充满魔性与乐趣的泡泡龙游戏，包含多种角色与挑战模式！">
    <title>龙泡泡大作战</title>
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="js/assests/red.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- UI 覆盖层（菜单系统） -->
    <div id="ui-overlay" class="overlay">
        <div id="main-menu" class="screen"></div>
        <div id="level-select" class="screen hidden"></div>
        <div id="character-select" class="screen hidden"></div>
        <div id="gacha-screen" class="screen hidden"></div>
        <div id="character-detail" class="screen hidden"></div>
        <div id="quest-screen" class="screen hidden"></div>
        <div id="challenge-screen" class="screen hidden"></div>
    </div>

    <!-- 游戏容器 -->
    <div id="game-container">
        <header id="game-header">
            <div class="logo">
                <img src="js/assests/red.png" class="logo-icon" alt="" />
                <h1>龙泡泡大作战</h1>
            </div>
            <div class="scores">
                <div class="score-board">分数 <span id="score">0</span></div>
                <div class="score-board best-score">最高分 <span id="best-score">0</span></div>
            </div>
        </header>

        <!-- 游戏信息栏（战斗中显示，Canvas 上方） -->
        <div id="game-info-bar" class="hidden">
            <div class="info-left">
                <span id="level-hud-name" class="info-name">关卡</span>
            </div>
            <div class="info-center">
                <span>🎯 <strong id="level-hud-target">0</strong></span>
                <span class="info-divider">|</span>
                <span>💣 <strong id="level-hud-shots">0</strong></span>
            </div>
            <div class="info-right">
                <span class="info-score">⭐ <strong id="hud-score">0</strong></span>
            </div>
        </div>

        <div class="canvas-wrapper hidden">
            <!-- 技能按钮 -->
            <div id="skill-btn" class="hidden">
                <div class="skill-icon"></div>
                <canvas id="skill-cooldown-ring" width="60" height="60"></canvas>
            </div>
            <!-- 计时挑战 HUD -->
            <div id="challenge-hud" class="hidden">
                <span>⏱ <span id="challenge-timer">00:00</span></span>
                <span>消除: <span id="challenge-clears">0</span></span>
            </div>
            <!-- 退出按钮 -->
            <button id="exit-game-btn" class="hidden" onclick="exitGame()">✕ 退出</button>

            <canvas id="gameCanvas" width="480" height="640"></canvas>
            <div id="game-overlay" class="hidden">
                <h2 id="overlay-title">游戏结束</h2>
                <div class="final-stats">
                    <p>得分: <span id="final-score">0</span></p>
                    <p class="new-record hidden" id="new-record-msg">🎊 新纪录！ 🎊</p>
                </div>
                <button id="restart-btn">再玩一次</button>
            </div>
        </div>
    </div>

    <!-- 游戏引擎 -->
    <script src="js/grid.js"></script>
    <script src="js/marble.js"></script>
    <script src="js/cannon.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/particles.js"></script>

    <!-- 系统层 -->
    <script src="js/systems/save-data.js"></script>
    <script src="js/systems/gacha-system.js"></script>
    <script src="js/systems/quest-system.js"></script>
    <script src="js/systems/character.js"></script>
    <script src="js/systems/level-config.js"></script>
    <script src="js/systems/challenge-system.js"></script>

    <!-- UI 层 -->
    <script src="js/ui/manager.js"></script>
    <script src="js/ui/main-menu.js"></script>
    <script src="js/ui/level-select.js"></script>
    <script src="js/ui/character-select.js"></script>
    <script src="js/ui/character-detail.js"></script>
    <script src="js/ui/gacha.js"></script>
    <script src="js/ui/quest.js"></script>
    <script src="js/ui/time-challenge.js"></script>

    <!-- 游戏主循环（最后加载，依赖以上所有） -->
    <script src="js/game.js"></script>

    <script>
        // 应用初始化
        function initApp() {
            loadSaveData();
            loadStaticData(() => {
                loadChallengeConfigs(() => {
                    renderMainMenu();
                    renderLevelSelect();
                    renderCharacterSelect();
                    renderGacha();
                    renderCharacterDetail();
                    renderQuest();
                    renderChallenge();
                    UI.init();
                    initGameCanvas();
                });
            });
        }

        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('SW Registered!'))
                    .catch(err => console.error('SW Failed!', err));
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

</html>
